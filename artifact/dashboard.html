      "tags": [
        "백엔드/서버개발",

      ],

      "source": "saramin",
      "external_id": "54607844",
      "url": "https://www.saramin.co.kr/zf_user/jobs/relay/view?rec_idx=54607844",
      "title": "킨코스코리아㈜ 백엔드 개발자/디자인그룹 경력 및 신입사원 모집",
      "company": "킨코스코리아(주)",
      "location": "서울 중구",
      "career_level": "신입·경력",
      "employment_type": "정규직",
      "description": "",
      "tags": [
        "백엔드/서버개발",
        "웹개발",
        "AI(인공지능)",
        "Python",
        "API"
      ],

}

<script>
(function () {
  const raw = JSON.parse(document.getElementById('job-data').textContent);
  const postings = raw.postings || [];

  const SOURCE_LABEL = { saramin: '사람인', jobkorea: '잡코리아' };
  const STATUS_OPTIONS = ['관심', '지원함', '서류전형', '면접', '최종합격', '불합격'];

  const STORE_KEY = 'jobAggregator:v1';
  function loadStore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        hiddenPostings: parsed.hiddenPostings || {},
        hiddenCompanies: parsed.hiddenCompanies || {},
        applications: parsed.applications || {},
      };
    } catch (e) {
      return { hiddenPostings: {}, hiddenCompanies: {}, applications: {} };
    }
  }
  function saveStore() {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }
  const store = loadStore();

  function postingKey(p) { return p.source + ':' + p.external_id; }
  function companyKey(p) { return (p.company || '').trim(); }
  function isHidden(p) {
    return !!store.hiddenPostings[postingKey(p)] || !!store.hiddenCompanies[companyKey(p)];
  }

  // --- Google Drive 동기화 (여러 기기에서 숨기기/지원현황 공유) ---
  const DRIVE_SERVER = 'Google Drive';
  const DRIVE_FILE_TITLE = 'job-aggregator-state.json';
  const DRIVE_FOLDER_ID = '1yLvcV9jeqou4GnuRvshbO5Vw-TJMFQ-o'; // "Job Aggregator" 폴더
  const syncStatusEl = document.getElementById('sync-status');
  let driveSaveTimer = null;

  function setSyncStatus(text) {
    syncStatusEl.textContent = '☁ ' + text;
  }

  function base64ToUtf8(b64) {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  async function loadFromDrive() {
    if (!window.claude || !window.claude.mcp) {
      setSyncStatus('이 보기에서는 동기화 불가 (로컬 저장만 사용)');
      return;
    }
    try {
      const searchRes = await window.claude.mcp.callTool(DRIVE_SERVER, 'search_files', {
        query: `title = '${DRIVE_FILE_TITLE}' and parentId = '${DRIVE_FOLDER_ID}'`,
        pageSize: 20,
      });
      const files = (searchRes.payload && searchRes.payload.files) || [];
      if (!files.length) {
        setSyncStatus('동기화 준비됨 (저장된 기록 없음)');
        return;
      }
      files.sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));
      const latest = files[0];

      const dlRes = await window.claude.mcp.callTool(DRIVE_SERVER, 'download_file_content', { fileId: latest.id });
      const json = base64ToUtf8(dlRes.payload.content);
      const remote = JSON.parse(json);

      store.hiddenPostings = remote.hiddenPostings || {};
      store.hiddenCompanies = remote.hiddenCompanies || {};
      store.applications = remote.applications || {};
      saveStore(); // 로컬 캐시도 최신 상태로 맞춤
      setSyncStatus('동기화됨 · ' + fmtShortTime(latest.modifiedTime));
      render();
    } catch (err) {
      const code = err && err.code;
      if (code === 'server_not_connected' || code === 'not_granted') {
        setSyncStatus('Google Drive 연결 안 됨 (로컬 저장만 사용)');
      } else if (code === 'needs_reauth') {
        setSyncStatus('Google Drive 재연결 필요 (claude.ai 설정 > 커넥터)');
      } else {
        setSyncStatus('동기화 실패, 로컬 저장만 사용 중');
      }
    }
  }

  function fmtShortTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function saveToDriveDebounced() {
    if (!window.claude || !window.claude.mcp) return;
    clearTimeout(driveSaveTimer);
    setSyncStatus('저장 중…');
    driveSaveTimer = setTimeout(saveToDrive, 1500);
  }

  async function saveToDrive() {
    try {
      await window.claude.mcp.callTool(DRIVE_SERVER, 'create_file', {
        title: DRIVE_FILE_TITLE,
        parentId: DRIVE_FOLDER_ID,
        textContent: JSON.stringify({
          hiddenPostings: store.hiddenPostings,
          hiddenCompanies: store.hiddenCompanies,
          applications: store.applications,
        }),
        contentMimeType: 'application/json',
        disableConversionToGoogleType: true,
      });
      setSyncStatus('동기화됨 · 방금 전');
    } catch (err) {
      setSyncStatus('저장 실패 (로컬에는 저장됨)');
    }
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('ko-KR', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  }

  document.getElementById('generated-line').textContent =
    '최근 갱신: ' + fmtDate(raw.generated_at);
  document.getElementById('footer-generated').textContent =
    '데이터 생성 시각: ' + fmtDate(raw.generated_at);

  document.getElementById('stat-filtered').textContent = raw.filtered_postings ?? postings.length;
  document.getElementById('stat-total').textContent = raw.total_postings ?? '–';
  document.getElementById('stat-saramin').textContent =
    postings.filter(p => p.source === 'saramin').length;
  document.getElementById('stat-jobkorea').textContent =
    postings.filter(p => p.source === 'jobkorea').length;

  function refreshTopStats() {
    const appliedCount = Object.values(store.applications)
      .filter(a => a && a.status).length;
    document.getElementById('stat-applied').textContent = appliedCount;
    const hiddenCount = postings.filter(isHidden).length;
    document.getElementById('hidden-count').textContent = hiddenCount;
  }

  const f = raw.filters || {};
  const summaryParts = [];
  if (f.keywords && f.keywords.length) summaryParts.push('키워드: ' + f.keywords.join(', '));
  if (f.regions && f.regions.length) summaryParts.push('지역: ' + f.regions.join(', '));
  if (f.career_levels && f.career_levels.length) summaryParts.push('경력: ' + f.career_levels.join(', '));
  document.getElementById('filter-summary').textContent = summaryParts.join(' · ');

  function uniqueSorted(values) {
    return Array.from(new Set(values.filter(Boolean))).sort((a, b) => a.localeCompare(b, 'ko'));
  }

  const regionSel = document.getElementById('f-region');
  uniqueSorted(postings.map(p => (p.location || '').split(' ')[0])).forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });

  const careerSel = document.getElementById('f-career');
  uniqueSorted(postings.map(p => p.career_level)).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    careerSel.appendChild(opt);
  });

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty-state');
  const visibleCountEl = document.getElementById('visible-count');

  const now = Date.now();
  const ONE_WEEK = 7 * 24 * 60 * 60 * 1000;

  function deadlineSortKey(p) {
    const m = (p.deadline || '').match(/(\d{2})\/(\d{2})/);
    if (!m) return Infinity;
    const year = new Date().getFullYear();
    const d = new Date(year, parseInt(m[1], 10) - 1, parseInt(m[2], 10));
    return d.getTime();
  }

  let showHidden = false;

  function render() {
    const q = document.getElementById('f-search').value.trim().toLowerCase();
    const region = regionSel.value;
    const career = careerSel.value;
    const source = document.getElementById('f-source').value;
    const status = document.getElementById('f-status').value;
    const sort = document.getElementById('f-sort').value;

    let rows = postings.filter(p => {
      const hidden = isHidden(p);
      if (showHidden) {
        if (!hidden) return false;
      } else if (hidden) {
        return false;
      }
      if (region && !(p.location || '').startsWith(region)) return false;
      if (career && p.career_level !== career) return false;
      if (source && p.source !== source) return false;
      if (status) {
        const cur = (store.applications[postingKey(p)] || {}).status || '';
        if (status === '__unset') {
          if (cur) return false;
        } else if (cur !== status) {
          return false;
        }
      }
      if (q) {
        const hay = [p.title, p.company, (p.tags || []).join(' ')].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    rows = rows.slice().sort((a, b) => {
      if (sort === 'deadline') return deadlineSortKey(a) - deadlineSortKey(b);
      return new Date(b.fetched_at) - new Date(a.fetched_at);
    });

    visibleCountEl.textContent = rows.length;
    listEl.innerHTML = '';
    emptyEl.style.display = rows.length ? 'none' : '';

    for (const p of rows) {
      const key = postingKey(p);
      const isNew = p.fetched_at && (now - new Date(p.fetched_at).getTime()) < ONE_WEEK;
      const hidden = isHidden(p);
      const appliedStatus = (store.applications[key] || {}).status || '';

      const card = document.createElement('div');
      card.className = 'card' + (hidden ? ' is-hidden' : '');
      card.dataset.key = key;
      card.dataset.company = companyKey(p);

      const chips = [p.location, p.career_level, p.employment_type]
        .filter(Boolean)
        .map(c => `<span class="chip">${escapeHtml(c)}</span>`)
        .join('');

      const statusOptions = ['<option value="">상태 없음</option>']
        .concat(STATUS_OPTIONS.map(s =>
          `<option value="${s}" ${s === appliedStatus ? 'selected' : ''}>${s}</option>`))
        .join('');

      const actionsHtml = hidden
        ? `<button type="button" class="icon-btn" data-action="restore">복원</button>`
        : `<button type="button" class="icon-btn" data-action="hide-posting">공고 숨기기</button>
           <button type="button" class="icon-btn" data-action="hide-company">회사 숨기기</button>`;

      card.innerHTML = `
        <span class="badge ${p.source}">${SOURCE_LABEL[p.source] || p.source}</span>
        <div class="card-main">
          <div class="card-title-row">
            <a class="card-title" href="${escapeAttr(p.url)}" target="_blank" rel="noopener noreferrer" title="${escapeAttr(p.title)}">${escapeHtml(p.title)}</a>
            ${isNew ? '<span class="new-pill">NEW</span>' : ''}
          </div>
          <div class="card-company">${escapeHtml(p.company)}</div>
          <div class="card-meta">${chips}</div>
        </div>
        <div class="card-side">
          <span class="deadline">${escapeHtml(p.deadline || '')}</span>
          <a class="go-link" href="${escapeAttr(p.url)}" target="_blank" rel="noopener noreferrer">공고 보기 ↗</a>
          <select class="status-select ${appliedStatus ? 'is-set' : ''}" data-role="status">${statusOptions}</select>
          <div class="card-actions">${actionsHtml}</div>
        </div>
      `;
      listEl.appendChild(card);
    }

    refreshTopStats();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  ['f-search', 'f-region', 'f-career', 'f-source', 'f-status', 'f-sort'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });

  const toggleHiddenBtn = document.getElementById('toggle-hidden');
  const toggleHiddenLabel = document.getElementById('toggle-hidden-label');
  function updateToggleLabel() {
    toggleHiddenLabel.textContent = showHidden ? '숨긴 공고만 표시 중 · 돌아가기' : '숨긴 공고 보기';
  }
  toggleHiddenBtn.addEventListener('click', () => {
    showHidden = !showHidden;
    updateToggleLabel();
    render();
  });

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const card = e.target.closest('.card');
    const key = card.dataset.key;
    const company = card.dataset.company;

    if (btn.dataset.action === 'hide-posting') {
      store.hiddenPostings[key] = true;
    } else if (btn.dataset.action === 'hide-company') {
      if (company) store.hiddenCompanies[company] = true;
    } else if (btn.dataset.action === 'restore') {
      delete store.hiddenPostings[key];
      if (company) delete store.hiddenCompanies[company];
    }
    saveStore();
    saveToDriveDebounced();
    render();
  });

  listEl.addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-role="status"]');
    if (!sel) return;
    const card = e.target.closest('.card');
    const key = card.dataset.key;
    const value = sel.value;
    if (value) {
      store.applications[key] = { status: value, updatedAt: new Date().toISOString() };
    } else {
      delete store.applications[key];
    }
    saveStore();
    saveToDriveDebounced();
    sel.classList.toggle('is-set', !!value);
    refreshTopStats();
  });

  render();
  loadFromDrive();
})();
</script>
